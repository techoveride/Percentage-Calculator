plugins {
    id "com.android.application"
    // Firebase (google-services.json)
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Release signing: android/key.properties -> keyAlias, keyPassword, storeFile, storePassword.
// If the file or the keystore is missing, release builds fall back to the debug key so
// `flutter run --release` still works (such a build cannot be uploaded to Play).
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def releaseStoreFile = keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
def hasReleaseKeystore = releaseStoreFile != null && releaseStoreFile.exists()

android {
    namespace = "com.techoveride.percentage_calculator"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        // Play Store ID. (The Kotlin namespace above stays as-is; it only
        // affects generated code, not the installed app's identity.)
        applicationId = "com.techoveride.percentagecalculator"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = releaseStoreFile
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseKeystore) {
                signingConfig = signingConfigs.release
            } else {
                logger.warn("WARNING: release keystore not found (see android/key.properties); signing release with the debug key.")
                signingConfig = signingConfigs.debug
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = "../.."
}
