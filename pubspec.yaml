name: percentage_calculator
description: A Simple Calculator for calculating percentages, tips, etc with ease of use.

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none'

# version: <versionName>+<versionCode>. Bump the build number for every Play upload.
version: 1.0.5+6

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^2.0.0
  firebase_analytics: ^13.0.0
  firebase_ai: ^5.0.0
  firebase_app_check: ^0.5.0
  firebase_core: ^5.0.0
  firebase_crashlytics: ^6.0.0
  firebase_remote_config: ^7.0.0
  google_mobile_ads: ^9.1.0
  home_widget: ^0.10.0
  http: ^1.6.0
  in_app_purchase: ^3.3.1
  in_app_review: ^2.0.12
  in_app_update: ^5.0.0
  intl: any
  package_info_plus: ^10.2.2
  quick_actions: ^1.1.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

# dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "images/logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "images/logo.png"

# dart run flutter_native_splash:create
# Design C from design/splash/ (gradient % on white; near-black in dark mode).
flutter_native_splash:
  color: "#ffffff"
  image: images/splash_icon.png
  color_dark: "#121316"
  image_dark: images/splash_icon.png
  android_12:
    # 1152x1152 with the % inside the 768px circle Android 12+ shows.
    image: images/splash_android12.png
    color: "#ffffff"
    image_dark: images/splash_android12.png
    color_dark: "#121316"

flutter:
  uses-material-design: true
  # Translations: lib/l10n/app_*.arb -> generated AppLocalizations
  generate: true

  assets:
    - images/
